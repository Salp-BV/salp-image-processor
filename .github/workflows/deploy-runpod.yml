name: Build and Deploy Salp GPU Image Processor to RunPod Serverless

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'app_gpu.py'
      - 'Dockerfile.gpu'
      - 'requirements-gpu.txt'
      - 'scripts/provision_runpod.py'
      - '.github/workflows/deploy-runpod.yml'

concurrency:
  group: runpod-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space for CUDA Build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Environment & Tag
        id: env-config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=gpu-main" >> $GITHUB_OUTPUT
            echo "TARGET_ENV=production" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=gpu-staging" >> $GITHUB_OUTPUT
            echo "TARGET_ENV=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push GPU Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ghcr.io/salp-bv/salp-image-processor:${{ steps.env-config.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Provisioning Dependencies
        run: pip install requests runpod

      - name: Deploy & Synchronize RunPod Endpoint
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE_PROCESSOR_API_KEY: ${{ secrets.IMAGE_PROCESSOR_API_KEY }}
        run: |
          python scripts/provision_runpod.py ${{ steps.env-config.outputs.TARGET_ENV }}
