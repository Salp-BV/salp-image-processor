name: Coolify Automated Deployment

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    name: Trigger Coolify Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Coolify Build API
        run: |
          COOLIFY_URL="http://167.233.241.9:8000/api/v1/deploy"
          API_TOKEN="${{ secrets.COOLIFY_API_TOKEN }}"

          if [ -z "$API_TOKEN" ]; then
            echo "❌ Error: COOLIFY_API_TOKEN secret is not set in GitHub repository settings."
            exit 1
          fi

          if [ "${{ github.ref_name }}" = "staging" ]; then
            APP_UUID="kxtvp0oljyvp9jtb5p4ncvuz"
          else
            APP_UUID="z12mvoxqhvgyozf12d00tl9b"
          fi

          echo "🚀 Triggering Coolify deployment for App UUID: $APP_UUID on branch ${{ github.ref_name }}..."
          curl -s -X POST "${COOLIFY_URL}?uuid=${APP_UUID}" \
               -H "Authorization: Bearer ${API_TOKEN}" \
               -H "Accept: application/json"
